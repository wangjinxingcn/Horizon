name: Daily Horizon Summary

on:
  schedule:
    # 目标：北京时间每周一/三/五 08:00 前出报。
    # GitHub 定时任务高峰期有延迟，提前 1 小时：UTC 周日/二/四 23:00 = 北京时间周一/三/五 07:00。
    - cron: '0 23 * * 0,2,4'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 按北京时间的星期几选择抓取窗口，与排班无缝衔接并留 1 小时缓冲：
          # 周一 08:00 覆盖周五 07:00 以来（73h），周三/周五 08:00 各覆盖 49h。
          DOW=$(TZ='Asia/Shanghai' date +%u)
          if [ "$DOW" -eq 1 ]; then HOURS=73; else HOURS=49; fi
          echo "Beijing weekday=$DOW, fetching last $HOURS hours"
          uv run horizon --hours $HOURS

      - name: Set current date as environment variable
        run: echo "DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
